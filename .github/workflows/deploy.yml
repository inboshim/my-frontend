name: React Production Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 소스코드 체크아웃 (최신 프론트 소스 동기화)
        uses: actions/checkout@v4

      - name: 의존성 패키지 설치 (npm install)
        run: |
          npm install

      - name: 🔥 [PDF 워커 종결자] Vite 빌드 전 빌드 산출물 폴더 정돈 스크립트
        run: |
          # 1. 빌드 전 public 폴더에 확실하게 pdf.worker.min.js 파일 배치 보장
          if (Test-Path "node_modules/pdfjs-dist/build/pdf.worker.min.mjs") {
              Copy-Item "node_modules/pdfjs-dist/build/pdf.worker.min.mjs" "public/pdf.worker.min.js" -Force
          } elseif (Test-Path "node_modules/pdfjs-dist/build/pdf.worker.min.js") {
              Copy-Item "node_modules/pdfjs-dist/build/pdf.worker.min.js" "public/pdf.worker.min.js" -Force
          }
        shell: powershell

      - name: 🔥 리액트 소스코드 최종 정적 빌드
        run: |
          npm run build

      - name: 프론트 정적 자산 동기화 완료 알림
        run: |
          echo "🎉 최신 리액트 소스코드가 깃허브로부터 빌드 완료되어 Nginx 배포 폴더(build)에 안전하게 반영되었습니다!"
